<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PROA ERP</title>

  <!-- PWA & Mobile Meta Tags -->
  <meta name="theme-color" content="#0F172A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PROA ERP">
  <meta name="application-name" content="PROA ERP">

  <!-- Iconos para Pantalla de Inicio (iPhone y Android) -->
  <link rel="apple-touch-icon" sizes="180x180" href="icon-512.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    /* Contenedor del Iframe a Pantalla Completa (Estilo App Nativa) */
    #app-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background-color: #0F172A;
    }
    /* Pantalla de Carga Inicial (Splash Screen) */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: #0F172A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s;
    }
    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-logo {
      width: 110px;
      height: 110px;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin-bottom: 20px;
      animation: pulseLogo 2s infinite ease-in-out;
    }
    .splash-title {
      color: #FFFFFF;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .splash-sub {
      color: #94A3B8;
      font-size: 0.82rem;
      margin-bottom: 24px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #38BDF8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
  </style>
</head>
<body>

  <!-- Splash Screen con tu Icono Oficial de PROA ERP -->
  <div id="splash-screen">
    <img src="icon-512.png" alt="PROA ERP" class="splash-logo">
    <div class="splash-title">PROA ERP</div>
    <div class="splash-sub">Cargando sistema en planta...</div>
    <div class="spinner"></div>
  </div>

  <!-- Iframe en Pantalla Completa con Permisos de Cámara Activos -->
  <iframe 
    id="app-frame" 
    src="PEGA_AQUI_LA_URL_DE_TU_GOOGLE_APP_SCRIPT" 
    allow="camera; microphone; geolocation; clipboard-read; clipboard-write;"
    onload="hideSplash()">
  </iframe>

  <script>
    function hideSplash() {
      setTimeout(function() {
        var splash = document.getElementById('splash-screen');
        if (splash) splash.classList.add('hidden');
      }, 700);
    }

    // Registrar Service Worker para habilitar instalación inmediata PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').catch(function(err) {
          console.log('SW registration skipped:', err);
        });
      });
    }
  </script>
</body>
</html>
