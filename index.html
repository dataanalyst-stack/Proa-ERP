<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PROA ERP</title>

  <!-- PWA & Mobile Meta Tags para Instalación en Celular -->
  <meta name="theme-color" content="#0F172A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PROA ERP">
  <meta name="application-name" content="PROA ERP">

  <!-- Iconos para Pantalla de Inicio (iPhone y Android) -->
  <link rel="apple-touch-icon" sizes="180x180" href="icon-512.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .splash-container {
      text-align: center;
      padding: 24px;
    }
    .splash-logo {
      width: 120px;
      height: 120px;
      border-radius: 26px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.6);
      margin-bottom: 24px;
      animation: pulseLogo 2s infinite ease-in-out;
    }
    .splash-title {
      color: #FFFFFF;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }
    .splash-sub {
      color: #94A3B8;
      font-size: 0.85rem;
      margin-bottom: 28px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid rgba(255,255,255,0.12);
      border-top-color: #F59E0B;
      border-radius: 50%;
      margin: 0 auto 20px auto;
      animation: spin 0.8s linear infinite;
    }
    .btn-manual {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 20px;
      background: #1E293B;
      border: 1px solid #334155;
      color: #38BDF8;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
  </style>
</head>
<body>

  <div class="splash-container">
    <!-- Icono Oficial PROA ERP -->
    <img src="icon-512.png" alt="PROA ERP" class="splash-logo">
    <div class="splash-title">PROA ERP</div>
    <div class="splash-sub">Iniciando aplicación de planta...</div>
    <div class="spinner"></div>
    <br>
    <a id="btn-manual" class="btn-manual" href="#" style="display:none;">Toca aquí para ingresar</a>
  </div>

  <script>
    // =========================================================================
    // PEGA AQUÍ LA URL EXACTA DE TU GOOGLE APPS SCRIPT (/exec)
    // =========================================================================
    var GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz1pDZaAFto8dTvljB5rauutlSQHGz3AwhiKCryT-iroxcs6XAomC04j9BRgbYHD4J9jA/exec";

    // Registrar Service Worker para permitir instalación nativa PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').catch(function(err) {
          console.log('SW registration:', err);
        });
      });
    }

    // Redirección directa al nivel superior:
    // Evita el error 401 que ocurre cuando Google bloquea iframes en cuentas corporativas móviles
    function redirectToApp() {
      if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL !== "PEGA_AQUI_LA_URL_DE_TU_GOOGLE_APP_SCRIPT") {
        // Redirigir de inmediato
        window.location.replace(GOOGLE_SCRIPT_URL);
      } else {
        var sub = document.querySelector('.splash-sub');
        if (sub) sub.textContent = "Debes configurar la URL de tu Google App Script en index.html";
      }
    }

    // Mostrar botón de respaldo por si el teléfono tarda en redirigir
    setTimeout(function() {
      var btn = document.getElementById('btn-manual');
      if (btn && GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL !== "PEGA_AQUI_LA_URL_DE_TU_GOOGLE_APP_SCRIPT") {
        btn.href = GOOGLE_SCRIPT_URL;
        btn.style.display = 'inline-block';
      }
    }, 2000);

    // Ejecutar redirección
    redirectToApp();
  </script>
</body>
</html>
